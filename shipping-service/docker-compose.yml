services:
  postgres:
    image: postgres:16-alpine
    container_name: shipping-postgres
    environment:
      POSTGRES_DB: shipping
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
    ports:
      - "5432:5432"
    volumes:
      - shipping-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shipping-postgres-data:
